<div>
  <label>
    Page size:
    <select [value]="pageSize()" (change)="pageSize.set(+($any($event.target).value)); page.set(1)">
      @for (s of [10,20,50]; track s) {
        <option [value]="s">{{ s }}</option>
      }
    </select>
  </label>

  <label>
    @if (pages().length > 0) {
      Page:
      <select [value]="page()" (change)="page.set(+($any($event.target).value))">
        @for (p of pages(); track p) {
          <option [value]="p">{{ p }}</option>
        } @empty {
          <option disabled>No pages available</option>
        }
    </select>
    } @else {
    <span>No pages</span>
  }
  </label>
</div>

<p>{{ range() }}</p>

<ul>
  @if (data.isLoading()) {
    <li>Loading items…</li>
  } @else if (items().length > 0) {
    @for (item of items(); track item.id) {
      <li>{{ item.name }}</li>
    } @empty {
      <li>No items available</li>
    }
  } @else {
    <li>No items available</li>
  }
</ul>
